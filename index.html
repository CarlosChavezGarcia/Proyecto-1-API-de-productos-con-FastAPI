
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tienda de Futbol</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light mt-5">

    <div class="container">
        <h2 class="text-center mb-4">Tienda de Futbol</h2>

        <div class="row g-4">

            <!-- Formulario de registro -->
            <div class="col-md-4">
                <div class="card shadow-sm border-0">

                    <div class="card-header bg-white fw-bold">
                        Registrar Producto
                    </div>

                    <div class="card-body">
                        <form id="formProducto">

                            <div class="mb-3">
                                <label for="nombre" class="form-label">
                                    Nombre del Producto
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="nombre"
                                    minlength="2"
                                    maxlength="100"
                                    placeholder="Ej. Jersey de futbol"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="precio" class="form-label">
                                    Precio ($)
                                </label>

                                <input
                                    type="number"
                                    step="0.01"
                                    min="0"
                                    class="form-control"
                                    id="precio"
                                    placeholder="1500.00"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="cantidad" class="form-label">
                                    Cantidad Disponible
                                </label>

                                <input
                                    type="number"
                                    step="1"
                                    min="0"
                                    class="form-control"
                                    id="cantidad"
                                    placeholder="10"
                                    required
                                >
                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Guardar Producto
                            </button>

                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla de inventario -->
            <div class="col-md-8">
                <div class="card shadow-sm border-0">

                    <div class="card-header bg-white fw-bold d-flex justify-content-between align-items-center">
                        <span>Catalogo de Productos</span>

                        <span
                            class="badge bg-secondary"
                            id="totalProductos"
                        >
                            0 productos
                        </span>
                    </div>

                    <div class="card-body p-0">
                        <div class="table-responsive">

                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Producto</th>
                                        <th>Precio</th>
                                        <th>Cantidad</th>
                                        <th class="text-end">Acciones</th>
                                    </tr>
                                </thead>

                                <tbody id="tablaProductos">
                                    <!-- Productos cargados con JavaScript -->
                                </tbody>
                            </table>

                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
